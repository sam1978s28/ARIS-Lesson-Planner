<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Rasheed International School - Teacher Lesson Planning & Monitoring Software</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            body { background: white !important; color: black !important; }
            no-print, header, nav, footer, .no-print { display: none !important; }
            .print-only { display: block !important; }
            .shadow-lg, .shadow-md, .shadow { box-shadow: none !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col transition-colors duration-200">

    <!-- Top Header Banner -->
    <header class="bg-gradient-to-r from-blue-900 via-indigo-900 to-blue-800 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2.5 rounded-xl border border-white/20 shadow-inner">
                    <i class="fa-solid fa-graduation-cap text-2xl text-amber-400"></i>
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-bold tracking-wide">Al Rasheed International School</h1>
                    <p class="text-xs text-blue-200 font-medium">Lesson Planning & Monitoring Portal (Reg No: RECO002713)</p>
                </div>
            </div>

            <!-- Role & User Switcher / Controls -->
            <div class="flex flex-wrap items-center gap-3">
                <!-- Manage Teachers Button (Visible for Admin/Coord) -->
                <button onclick="openManageTeachersModal()" id="btnManageTeachers" class="bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg text-xs font-semibold border border-white/20 transition-all flex items-center gap-1.5 hidden">
                    <i class="fa-solid fa-users-gear text-amber-300"></i> Onboard / Manage Teachers
                </button>

                <!-- Role Selector -->
                <div class="flex items-center bg-white/10 rounded-lg p-1 border border-white/20">
                    <button onclick="switchRole('teacher')" id="btnRoleTeacher" class="px-3 py-1.5 rounded-md text-xs font-semibold transition-all bg-white text-blue-900 shadow">
                        <i class="fa-solid fa-chalkboard-user mr-1.5"></i> Teacher
                    </button>
                    <button onclick="switchRole('coordinator')" id="btnRoleCoord" class="px-3 py-1.5 rounded-md text-xs font-semibold transition-all text-white hover:bg-white/10">
                        <i class="fa-solid fa-user-tie mr-1.5"></i> Coordinator
                    </button>
                    <button onclick="switchRole('principal')" id="btnRolePrincipal" class="px-3 py-1.5 rounded-md text-xs font-semibold transition-all text-white hover:bg-white/10">
                        <i class="fa-solid fa-award mr-1.5"></i> Principal
                    </button>
                </div>

                <!-- Dark Mode Toggle -->
                <button onclick="toggleDarkMode()" class="bg-white/10 hover:bg-white/25 p-2 rounded-lg text-white border border-white/20 transition-all text-sm" title="Toggle Theme">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">

        <!-- Active User & Context Bar -->
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-4 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
            <div class="flex items-center space-x-3">
                <div id="userAvatar" class="w-12 h-12 rounded-full bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300 font-bold flex items-center justify-center text-lg border border-blue-200">
                    AK
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h2 id="currentUserNameDisplay" class="font-bold text-lg text-slate-900 dark:text-white">Amina Khan</h2>
                        <span id="currentUserRoleBadge" class="px-2 py-0.5 text-xs font-semibold bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-300 rounded-full">Teacher</span>
                    </div>
                    <p id="currentUserMeta" class="text-xs text-slate-500 dark:text-slate-400">Faculty Member • Multi-Class & Subject Access</p>
                </div>
            </div>

            <!-- Teacher Selection Dropdown -->
            <div id="teacherSelectorWrapper" class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
                <div class="flex flex-col">
                    <label class="text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Select Teacher Profile:</label>
                    <select id="activeTeacherSelect" onchange="changeActiveTeacher()" class="bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-1.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-200">
                        <!-- Populated dynamically -->
                    </select>
                </div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-slate-200 dark:border-slate-700 space-x-6 overflow-x-auto">
            <button onclick="switchTab('builder')" id="tabBuilder" class="pb-3 px-1 border-b-2 border-blue-600 text-blue-600 dark:text-blue-400 font-semibold text-sm flex items-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-pen-to-square"></i> Lesson Plan Builder
            </button>
            <button onclick="switchTab('myPlans')" id="tabMyPlans" class="pb-3 px-1 border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 font-semibold text-sm flex items-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-folder-open"></i> My Saved / Submitted Plans
            </button>
            <button onclick="switchTab('adminDashboard')" id="tabAdmin" class="pb-3 px-1 border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 font-semibold text-sm hidden items-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-chart-line"></i> Admin Monitoring Dashboard <span id="pendingBadge" class="bg-rose-500 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold">0</span>
            </button>
        </div>

        <!-- ================= TAB 1: BUILDER ================= -->
        <div id="sectionBuilder" class="space-y-6">
            
            <!-- Metadata: Date, Class, Subject, Topic -->
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Date</label>
                    <input type="date" id="lessonDate" value="2026-10-31" onchange="loadCurrentForm()" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-sm font-semibold focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-200">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Class / Grade</label>
                    <select id="lessonClass" onchange="loadCurrentForm()" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-sm font-semibold focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-200">
                        <option value="Nursery">Nursery</option>
                        <option value="LKG">LKG</option>
                        <option value="UKG">UKG</option>
                        <option value="Class 1">Class 1</option>
                        <option value="Class 2">Class 2</option>
                        <option value="Class 3">Class 3</option>
                        <option value="Class 4" selected>Class 4</option>
                        <option value="Class 5">Class 5</option>
                        <option value="Class 6">Class 6</option>
                        <option value="Class 7">Class 7</option>
                        <option value="Class 8">Class 8</option>
                        <option value="Class 9">Class 9</option>
                        <option value="Class 10">Class 10</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Subject</label>
                    <select id="lessonSubject" onchange="loadCurrentForm()" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-sm font-semibold focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-200">
                        <option value="Mathematics">Mathematics</option>
                        <option value="EVS">EVS</option>
                        <option value="SST">SST</option>
                        <option value="Hindi">Hindi</option>
                        <option value="Urdu">Urdu</option>
                        <option value="Kashmiri">Kashmiri</option>
                        <option value="Art & Craft">Art & Craft</option>
                        <option value="Circle time">Circle time</option>
                        <option value="Islamiah">Islamiah</option>
                        <option value="Computers">Computers</option>
                        <option value="Science Lab">Science Lab</option>
                        <option value="Sports/Games/Activity">Sports/Games/Activity</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Topic / Title</label>
                    <input type="text" id="lessonTopic" placeholder="e.g. Fractions & Decimals" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-sm font-semibold focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-200">
                </div>
            </div>

            <!-- 6 Core Framework Sections (Aim, Action, Analysis, Application, Assessment, Resources) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- 1. Aim -->
                <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-5 flex flex-col">
                    <div class="flex justify-between items-center mb-2">
                        <label class="font-bold text-sm text-blue-900 dark:text-blue-300 flex items-center gap-2">
                            <span class="bg-blue-100 dark:bg-blue-900/60 text-blue-700 dark:text-blue-300 w-6 h-6 rounded-full inline-flex items-center justify-center text-xs">1</span> 
                            Aim (Objective & Learning Goals)
                        </label>
                        <span id="count_aim" class="text-xs text-slate-400 font-medium">0 words</span>
                    </div>
                    <textarea id="val_aim" oninput="updateWordCount('aim')" rows="4" placeholder="What are the specific learning objectives and goals for this lesson? (1 - 1000 words)" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-200 resize-y"></textarea>
                </div>

                <!-- 2. Action -->
                <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-5 flex flex-col">
                    <div class="flex justify-between items-center mb-2">
                        <label class="font-bold text-sm text-blue-900 dark:text-blue-300 flex items-center gap-2">
                            <span class="bg-blue-100 dark:bg-blue-900/60 text-blue-700 dark:text-blue-300 w-6 h-6 rounded-full inline-flex items-center justify-center text-xs">2</span> 
                            Action (Pedagogy & Step-by-Step Delivery)
                        </label>
                        <span id="count_action" class="text-xs text-slate-400 font-medium">0 words</span>
                    </div>
                    <textarea id="val_action" oninput="updateWordCount('action')" rows="4" placeholder="Detail the step-by-step teaching delivery, hook, guided practice, and activities. (1 - 1000 words)" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-200 resize-y"></textarea>
                </div>

                <!-- 3. Analysis -->
                <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-5 flex flex-col">
                    <div class="flex justify-between items-center mb-2">
                        <label class="font-bold text-sm text-blue-900 dark:text-blue-300 flex items-center gap-2">
                            <span class="bg-blue-100 dark:bg-
